<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncRoom preview</title>
  <style>
    :root {
      --vscode-font-family: 'Segoe UI', system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-editor-font-family: Consolas, 'Courier New', monospace;
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-icon-foreground: #c5c5c5;
      --vscode-focusBorder: #0078d4;
      --vscode-button-background: #0078d4;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #026ec1;
      --vscode-button-secondaryBackground: #313131;
      --vscode-button-secondaryForeground: #cccccc;
      --vscode-button-secondaryHoverBackground: #3c3c3c;
      --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
      --vscode-toolbar-activeBackground: rgba(99, 102, 103, 0.31);
      --vscode-input-background: #313131;
      --vscode-input-foreground: #cccccc;
      --vscode-input-border: #3c3c3c;
      --vscode-input-placeholderForeground: #989898;
      --vscode-progressBar-background: #0078d4;
      --vscode-panel-border: #2b2b2b;
      --vscode-editorWidget-background: #202020;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-badge-background: #4d4d4d;
      --vscode-badge-foreground: #ffffff;
      --vscode-list-inactiveSelectionBackground: #37373d;
      --vscode-textLink-activeForeground: #4daafc;
      --vscode-testing-iconPassed: #73c991;
    }
    html { background: #181818; }
    /* Ancho típico de la barra lateral. El navegador no baja de ~500 px, así que se fija aquí. */
    body { width: 21rem; }
  </style>
  <link rel="stylesheet" href="../../dist/webview/webview.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__SYNCROOM_STRINGS__ = {
      'lobby.title': 'Listen together',
      'lobby.body': 'Create a room and share its code. Everyone in the room hears the same YouTube queue at the same time.',
      'lobby.create': 'Create room',
      'lobby.joinLabel': 'Have a code?',
      'lobby.join': 'Join',
      'lobby.open': 'Open rooms',
      'lobby.searching': 'Looking for open rooms…',
      'lobby.none': 'No open rooms right now.',
      'lobby.offline': 'Could not reach the relays.',
      'lobby.enter': 'Join this room',
      'lobby.listeners': '{0} listening',
      'lobby.more': 'More',
      'lobby.hideRoom': 'Hide this room',
      'lobby.hideOwner': 'Hide rooms from this creator',
      'lobby.showHidden': 'Show hidden ({0})',
      'lobby.groups': 'Groups',
      'lobby.addGroup': '+ Group',
      'lobby.removeGroup': 'Remove group {0}',
      'room.code': 'Room code',
      'room.copy': 'Copy room code',
      'room.leave': 'Leave room',
      'room.you': 'you',
      'room.rename': 'Change your name',
      'room.unnamed': 'Someone',
      'room.direct': 'Connected directly',
      'room.relayed': 'Connected through relays',
      'room.alone': 'Waiting for others to join',
      'room.starting': 'Starting the audio engine…',
      'room.fault': 'YouTube could not be loaded in the audio engine. Check your connection.',
      'room.visibility': 'Who can find this room',
      'room.private': 'Private (code only)',
      'room.public': 'Public',
      'room.group': 'Group: {0}',
      'room.newGroup': 'New group…',
      'room.publicHint': 'Anyone using SyncRoom can find this room and its code. People who join with direct connections on can see your IP address.',
      'room.visibleOn': 'Listed on {0} relays',
      'room.notListed': 'Not reaching any relay',
      'room.badgePublic': 'Public',
      'room.badgeGroup': 'Group',
      'player.nothing': 'Nothing playing',
      'player.hint': 'Search YouTube or paste a link below to start.',
      'player.play': 'Play',
      'player.pause': 'Pause',
      'player.next': 'Next',
      'player.seek': 'Position',
      'player.volume': 'Volume',
      'player.show': 'Show player window',
      'player.hide': 'Hide player window',
      'player.previewOn': 'Show the video here',
      'player.previewOff': 'Show only the thumbnail',
      'player.unplayable': 'This video is not available for you.',
      'add.placeholder': 'Search YouTube or paste a link',
      'add.button': 'Add',
      'add.search': 'Search',
      'search.title': 'Results',
      'search.searching': 'Searching YouTube…',
      'search.none': 'No videos found.',
      'search.close': 'Close results',
      'search.live': 'LIVE',
      'search.add': 'Add to queue',
      'search.added': 'Added — add again',
      'search.playlist': 'Playlist',
      'search.addPlaylist': 'Add the whole playlist to the queue',
      'queue.title': 'Queue',
      'queue.empty': 'The queue is empty.',
      'queue.playNow': 'Play now',
      'queue.remove': 'Remove from queue',
      'queue.addedBy': 'added by {0}',
      'queue.unplayable': 'not available for you',
      'queue.playNext': 'Play next',
      'queue.lockQueue': 'Only you can change the queue',
      'queue.lockPlayback': 'Only you can play, pause or skip',
      'queue.lockQueueLabel': 'Queue',
      'queue.lockPlaybackLabel': 'Playback',
      'queue.lockedQueue': 'Only {0} can change the queue.',
      'queue.lockedPlayback': 'Only {0} can play, pause or skip.',
      'queue.drag': 'Drag to reorder',
      'chat.join': 'Join or create a room in the SyncRoom view to chat.',
      'chat.empty': 'No messages yet.',
      'chat.placeholder': 'Message the room',
      'chat.send': 'Send',
      'chat.present': 'In the room: {0}',
      'chat.joined': '{0} joined',
      'chat.left': '{0} left'
    }
    const track = (n, videoId, title, author, addedBy, extra) =>
      Object.assign({id: 'p:' + n, videoId, title, author, addedBy, current: false, unplayable: false}, extra)

    const room = {
      code: 'KQ7MX2PA',
      me: {id: 'me', name: 'Luis'},
      peers: [{id: 'me', name: 'Luis'}, {id: 'a', name: 'Dayana'}, {id: 'b', name: ''}],
      tracks: [
        track(1, 'M7lc1UVf-VE', 'YouTube Developers Live: Embedded Web Player Customization', 'Google for Developers', 'Luis', {current: true}),
        track(2, 'jNQXAC9IVRw', 'Me at the zoo', 'jawed', 'Dayana'),
        track(3, 'dQw4w9WgXcQ', 'A very long title that should be cut with an ellipsis instead of wrapping onto a second line', 'Somebody', 'Luis'),
        track(4, 'aaaaaaaaaaa', 'Blocked in your country', 'Label', 'Dayana', {unplayable: true})
      ],
      playback: {trackId: 'p:1', playing: true, positionS: 84, durationS: 1344},
      // ?policy=guest: lo que ve alguien que no es el dueño con la lista bloqueada.
      policy: new URLSearchParams(location.search).get('policy') === 'guest'
        ? {ownerName: 'Dayana', mine: false, listed: 'global', lockQueue: true, lockPlayback: true, canEditQueue: false, canControlPlayback: false}
        : {ownerName: 'Luis', mine: true, listed: 'group', lockQueue: true, lockPlayback: false, canEditQueue: true, canControlPlayback: true},
      chat: [
        {key: 1, id: 'present', kind: 'present', from: '', name: '', text: 'Dayana', at: Date.now() - 600000, mine: false},
        {key: 2, id: 'c1', kind: 'message', from: 'a', name: 'Dayana', text: 'pon algo de Creepy Nuts', at: Date.now() - 300000, mine: false},
        {key: 3, id: 'c2', kind: 'message', from: 'me', name: 'Luis', text: 'va, la siguiente es tuya. Este mensaje es largo para ver cómo parte en varias líneas sin desbordar la barra.', at: Date.now() - 120000, mine: true},
        {key: 4, id: 'j1', kind: 'joined', from: 'b', name: 'Someone', text: '', at: Date.now() - 60000, mine: false},
        {key: 5, id: 'c3', kind: 'message', from: 'a', name: 'Dayana', text: '🔥', at: Date.now() - 5000, mine: false}
      ],
      engineReady: true,
      fault: undefined,
      net: {directPeers: 1, relaysOk: 4},
      volume: 60
    }

    const params = new URLSearchParams(location.search)
    const wanted = params.get('state')
    // ?view=chat enseña la vista del segundo icono.
    window.__SYNCROOM_VIEW__ = params.get('view') === 'chat' ? 'chat' : 'room'
    const directory = {
      status: 'ok',
      rooms: params.get('rooms') === 'none' ? [] : [
        {code: 'KQ7MX2PA', owner: 'Dayana', playing: 'Creepy Nuts — Bling-Bang-Bang-Born', listeners: 4, locked: true, group: null},
        {code: 'ZT4HWR9C', owner: 'Equipo front', playing: 'Lo-fi para concentrarse, con un título bastante largo que se corta', listeners: 2, locked: false, group: 'motorflash front'},
        {code: 'PM3XQ7VB', owner: 'Leo', playing: null, listeners: 1, locked: false, group: null}
      ],
      hiddenCount: 1,
      groups: ['motorflash front']
    }
    const state = wanted === 'lobby'
      ? {inRoom: false, directory}
      // ?preview=off: el usuario apagó el vídeo en la vista (aquí no hay motor: siempre se ve la miniatura).
      : {inRoom: true, room, playerVisible: false, listing: {relaysOk: 3, group: 'motorflash front'}, groups: ['motorflash front'], videoPreview: params.get('preview') !== 'off'}
    // Igual que el host real: responde con el estado cuando la vista dice «ready».
    window.acquireVsCodeApi = () => ({
      postMessage: message => {
        console.log('to host', message)
        if (message.t === 'ready') window.postMessage({t: 'state', state}, '*')
        // Búsqueda de mentira: ?search=<texto> la lanza sola al cargar; ?search-error=1 simula el fallo.
        if (message.t === 'search') {
          const reply = params.get('search-error') === '1'
            ? {results: [], error: 'YouTube search is not available right now. Paste a link instead.'}
            : {results: fakeResults, error: null}
          setTimeout(() => window.postMessage({t: 'searchResults', id: message.id, ...reply}, '*'), 400)
        }
      }
    })
    const fakeResults = [
      {kind: 'video', videoId: 'TmKh7lAwnBI', title: 'BAD BUNNY x JHAY CORTEZ - DÁKITI | EL ÚLTIMO TOUR DEL MUNDO (Official Video)', author: 'Bad Bunny', duration: '3:34'},
      {kind: 'video', videoId: 'rFZHOHl-L8A', title: 'lofi hip hop radio 📚 beats to relax/study to', author: 'Lofi Girl', duration: null},
      {kind: 'playlist', listId: 'PLYglnXQVa7ri7yma8o8yB2AlrbYGznji5', videoId: '1Nr_tqkMsJs', title: 'Calle 13 - Greatest Hits', author: 'Calle13VEVO', count: 32},
      {kind: 'video', videoId: 'doLMt10ytHY', title: 'Bad Bunny - Yonaguni (Official Video)', author: 'Bad Bunny', duration: '3:31'},
      {kind: 'video', videoId: 'wkuT_VJbUrc', title: 'BAD BUNNY MIX 2025 - 30 Las mejores canciones de Bad Bunny 2025', author: 'Kazi Smrity', duration: '2:28:36'},
      {kind: 'playlist', listId: 'RDEMAwkGY9PRZjwjNZSPiC', videoId: 'vXtJkDHEAAc', title: 'Mix - Calle 13', author: 'Calle 13, Don Omar and more', count: null}
    ]
    if (params.get('search') !== null) {
      setTimeout(() => {
        const input = document.querySelector('.add input')
        input.value = params.get('search')
        input.dispatchEvent(new Event('input', {bubbles: true}))
        setTimeout(() => document.querySelector('.add button').click(), 50)
      }, 300)
    }
  </script>
  <script src="../../dist/webview/webview.js"></script>
</body>
</html>
